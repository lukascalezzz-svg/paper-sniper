# Paper sniper 24/7 na GitHub Actions: jedna "smena" traje ~5h45m, sledeća čeka u redu i preuzima stanje iz keša.
name: paper-sniper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: sniper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            trades.csv
          key: sniper-state-${{ github.run_id }}
          restore-keys: sniper-state-
      - run: node server.js
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          MAX_RUN_MS: '20700000'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            trades.csv
          key: sniper-state-${{ github.run_id }}
